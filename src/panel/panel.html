<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tabloom</title>
  <link rel="stylesheet" href="panel.css">
  <link rel="stylesheet" href="color-palette.css">
  <link rel="stylesheet" href="ai-progress.css">
  <link rel="stylesheet" href="developer-mode.css">
</head>
<body>
  <div class="panel">
    <header>
      <div class="brand"><div class="mark"></div><div><strong>Tabloom</strong><div class="window" id="windowMeta">正在读取标签…</div></div></div>
      <div class="header-actions"><button class="icon" id="undo" title="撤销上次保存">↶</button><button class="icon" id="settingsButton" title="模型设置">⚙</button></div>
    </header>

    <main id="editorView" class="content">
      <div class="section-title"><span>标签与分组</span><button id="addGroup" class="text-button">＋ 新建分组</button></div>
      <div id="workspace" class="workspace"><div class="loading">正在读取当前窗口…</div></div>
    </main>

    <main id="settingsView" class="settings hidden">
      <div class="settings-title"><button id="settingsBack" class="icon">←</button><div><strong>模型设置</strong><small>AI 可选，不配置也能手动分组</small></div></div>
      <label>Base URL<input id="baseUrl" placeholder="https://api.deepseek.com"></label>
      <label>模型名称<input id="model" placeholder="deepseek-v4-flash"></label>
      <label>API Key<input id="apiKey" type="password" autocomplete="off" placeholder="输入新 Key，留空则保留已有 Key"></label>
      <label class="check"><input id="rememberKey" type="checkbox"> 在这台浏览器中记住 Key</label>
      <label class="check"><input id="thinkingEnabled" type="checkbox"> 启用思考模式 <small>（较慢，使用 low 强度）</small></label>
      <label class="check"><input id="developerMode" type="checkbox"> 开发者模式 <small>（显示 AI 原始响应）</small></label>
      <label>整理偏好<textarea id="preference" placeholder="例如：尽可能去分组；优先按项目分组；localhost 与测试环境放在一起。非思考模式建议明确写上“尽可能去分组”。"></textarea></label>
      <div class="settings-actions"><button id="testConnection" class="secondary">测试连接</button><button id="saveSettings" class="primary">保存设置</button></div>
      <p class="privacy">默认示例为 DeepSeek。远程地址必须使用 HTTPS；localhost 可以使用 HTTP。标签正文不会发送给模型。</p>
    </main>

    <footer id="toolbar">
      <div class="modes"><button class="mode active" data-mode="ungrouped">整理未分组</button><button class="mode" data-mode="optimize">优化已有组</button><button class="mode" data-mode="regroup">全部重组</button></div>
      <div class="actions"><button id="aiAction" class="secondary">AI 整理</button><button id="reset" class="secondary">重置</button><button id="save" class="primary">保存调整</button></div>
      <div class="footnote">手动功能无需 AI · 仅处理当前窗口</div>
    </footer>
    <aside id="aiProgress" class="ai-progress hidden" aria-live="polite">
      <button id="aiProgressToggle" class="ai-progress-head" aria-expanded="false">
        <span class="ai-pulse"></span><span id="aiStage">正在整理</span><span id="aiElapsed">0s</span><span class="ai-chevron">⌃</span>
      </button>
      <div id="aiProgressBody" class="ai-progress-body hidden">
        <div id="aiReasoning" class="ai-reasoning">等待模型返回…</div>
        <details id="aiDebug" class="ai-debug hidden"><summary>原始响应</summary><pre id="aiRaw"></pre></details>
      </div>
    </aside>
    <div id="toast" class="toast" role="status"></div>
  </div>
  <script type="module" src="panel.js"></script>
</body>
</html>
